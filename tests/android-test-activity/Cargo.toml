[package]
name = "testactivity"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
abos-jni = { path = "../../crates/abos-jni" }

[build-dependencies]
abos-jbindgen = { path = "../../crates/abos-jbindgen" }

[features]
sdk_util_time_utils = []
sdk_os_build = []
sdk_os_binder = []
sdk_bluetooth = []
sdk_content_intent = []
sdk_net_uri = []

[lints.rust]
unsafe_code = "forbid"
