[package]
name = "testactivity"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.22.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "tracing-log"] }

[build-dependencies]
abos-jbindgen = { path = "../../crates/abos-jbindgen" }
abos-javac = { path = "../../crates/abos-javac" }

[features]
sdk_util_time_utils = []
sdk_os_build = []
sdk_os_binder = []
sdk_bluetooth = []
sdk_content_intent = []
sdk_net_uri = []

[lints.rust]
unsafe_code = "forbid"
