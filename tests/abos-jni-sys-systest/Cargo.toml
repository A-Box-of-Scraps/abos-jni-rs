[package]
name = "abos-jni-sys-systest"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
abos-jni-sys = { path = "../../crates/abos-jni-sys" }

[build-dependencies]
cc = "1.10"
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
