[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["lints/*", "tests/android-test-activity", "crates/abos-jbindgen/tests/runtime"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

[workspace.metadata.dylint]
libraries = [{ path = "lints/explicit_binding_types" }]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
allow_attributes_without_reason = "warn"
let_underscore_must_use = "warn"
exit = "warn"
