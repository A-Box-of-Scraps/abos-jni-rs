[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["lints/*", "tests/android-test-activity", "tests/abos-jni-sys-systest", "crates/abos-jbindgen/tests/runtime"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

[workspace.dependencies]
# Internal crates
abos-cafebabe = { path = "crates/abos-cafebabe", version = "0.1.0" }
abos-javac = { path = "crates/abos-javac", version = "0.1.0" }
abos-jbindgen-annotations = { path = "crates/abos-jbindgen-annotations", version = "0.1.0" }
abos-jni-sys-macros = { path = "crates/abos-jni-sys-macros", version = "0.1.0" }

# Shared external dependencies
tempfile = "3"
thiserror = "2"

# Crate-specific external dependencies
clap = { version = "4", features = ["derive"] }
jni = { version = "0.22.4", features = ["invocation"] }
libloading = "0.9"
log = "0.4"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
trybuild = "1"
unicode-ident = "1"
which = "8"
zip = { version = "7", default-features = false, features = ["deflate"] }

[workspace.metadata.dylint]
libraries = [{ path = "lints/explicit_binding_types" }]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
allow_attributes_without_reason = "warn"
let_underscore_must_use = "warn"
exit = "warn"
