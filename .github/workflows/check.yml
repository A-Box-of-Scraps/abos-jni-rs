name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      MISE_HTTP_TIMEOUT: 300s
      MISE_DISABLE_TOOLS: android-cli,cargo:cargo-ndk,cargo:cargo-fuzz
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Set up mise and mold
        uses: jdx/mise-action@v5
        with:
          install_args: mold
          cache_save_post: true
          cache_key_prefix: mise-v2

      - name: Install remaining tools
        run: mise exec mold -- mise install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          # Include the JDK and other tools used by build scripts in the cache key.
          key: ${{ hashFiles('mise.toml', 'Cargo.toml') }}
          cache-on-failure: true
          workspaces: |
            .
            tests/abos-jni-sys-systest
            tests/abos-jvmti-sys-systest
            crates/abos-jbindgen/tests/runtime
            tools/abos-jni-gen-windows-bindings

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pom.xml', 'mise.toml') }}
          restore-keys: maven-v1-${{ runner.os }}-${{ runner.arch }}-

      # Save Dylint's nested build outputs before rust-cache performs its cleanup.
      - name: Cache Dylint builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dylint_drivers
            target/dylint/libraries
          key: dylint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'mise.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}

      - name: Run checks
        run: mise run check
