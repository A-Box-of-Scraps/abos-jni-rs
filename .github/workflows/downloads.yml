name: Downloads

on:
  schedule:
    # Every Monday at 04:23 UTC.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate combined downloads badge
        run: python -m scripts.ci.downloads "$RUNNER_TEMP/downloads-site/downloads.json"

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/downloads-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy badge data
        id: deployment
        uses: actions/deploy-pages@v5
