[package]
name = "abos-jvmti"
version = "0.2.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Environment and agent utilities for the Java Virtual Machine Tool Interface."

[lints]
workspace = true

[dependencies]
abos-jni.workspace = true
abos-jvmti-sys.workspace = true

[dev-dependencies]
criterion.workspace = true
static_assertions.workspace = true
tempfile.workspace = true

[features]
default = []
invocation = ["abos-jni/invocation"]

[[bench]]
name = "api_calls"
harness = false
required-features = ["invocation"]

[[bench]]
name = "environment_lifecycle"
harness = false
required-features = ["invocation"]

[[bench]]
name = "rust_utilities"
harness = false

[[example]]
name = "events_agent"
crate-type = ["cdylib"]

[[example]]
name = "profiling_agent"
crate-type = ["cdylib"]

[[example]]
name = "shutdown_agent"
crate-type = ["cdylib"]
