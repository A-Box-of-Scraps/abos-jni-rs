[package]
name = "abos-jbindgen-runtime-test"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
abos-jni = { path = "../../../abos-jni", features = ["invocation"] }

[build-dependencies]
abos-jbindgen = { path = "../.." }
abos-javac = { path = "../../../abos-javac" }
zip = { version = "7", default-features = false, features = ["deflate"] }
