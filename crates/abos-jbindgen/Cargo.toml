[package]
name = "abos-jbindgen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Generate Rust JNI bindings from Java source, bytecode, and Android SDKs."

[features]
# Internal parser access for the isolated fuzz workspace.
_fuzzing = []

[lints]
workspace = true

[dependencies]
abos-cafebabe.workspace = true
abos-jbindgen-annotations.workspace = true
abos-jni = { workspace = true, features = ["invocation"] }
clap.workspace = true
log.workspace = true
thiserror.workspace = true
zip.workspace = true

[build-dependencies]
abos-javac.workspace = true
zip.workspace = true

[dev-dependencies]
abos-javac.workspace = true
indoc.workspace = true
tempfile.workspace = true
