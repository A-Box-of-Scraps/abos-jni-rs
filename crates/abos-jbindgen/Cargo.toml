[package]
name = "abos-jbindgen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Generate Rust JNI bindings from Java source, bytecode, and Android SDKs."

[lints]
workspace = true

[dependencies]
abos-jbindgen-annotations = { path = "../abos-jbindgen-annotations", version = "0.1.0" }
cafebabe = "0.9"
clap = { version = "4", features = ["derive"] }
jni = { version = "0.22.4", features = ["invocation"] }
log = "0.4"
thiserror = "2"
zip = { version = "7", default-features = false, features = ["deflate"] }

[build-dependencies]
abos-javac = { path = "../abos-javac", version = "0.1.0" }
zip = { version = "7", default-features = false, features = ["deflate"] }

[dev-dependencies]
abos-javac = { path = "../abos-javac", version = "0.1.0" }
tempfile = "3"
