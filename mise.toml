[tools]
dprint = "0.64.3"
"cargo:jscpd" = "5.4.2"
"cargo:cargo-dylint" = "6.3.2"
"cargo:dylint-link" = "6.3.2"
python = "3.15.2"
maven = "3.9.16"

[settings]
task.output = "interleave"
task.quiet = true

[tasks.check]
depends = ["fmt", "lint", "check:duplicates", "check:file-length"]

[tasks."check:ci"]
depends = ["fmt:check", "lint", "check:duplicates", "check:file-length"]

[tasks."check:duplicates"]
run = "jscpd --fail-on-empty --no-tips"

[tasks."check:file-length"]
run = "python scripts/check-file-length.py"

[tasks."clone:javac"]
run = "python scripts/clone-reference.py javac"

[tasks."clone:jbindgen"]
run = "python scripts/clone-reference.py jbindgen"

[tasks.fmt]
depends = ["fmt:java"]
run = [
  "mise fmt -q",
  "cargo fmt --all -q",
  "cd lints/explicit_binding_types && cargo fmt --all -q",
  "dprint fmt --log-level warn",
]

[tasks."fmt:check"]
depends = ["fmt:java:check"]
run = [
  "mise fmt --check -q",
  "cargo fmt --all --check -q",
  "cd lints/explicit_binding_types && cargo fmt --all --check -q",
  "dprint check --log-level warn",
]

[tasks."fmt:java"]
run = "mvn --batch-mode --no-transfer-progress -q spotless:apply"

[tasks."fmt:java:check"]
run = "mvn --batch-mode --no-transfer-progress -q spotless:check"

[tasks.lint]
env = { DYLINT_RUSTFLAGS = "-D warnings" }
run = [
  "cargo clippy --workspace --all-targets --all-features -q -- -D warnings",
  "cargo dylint --all --workspace --fail-on-no-libraries -q -- --all-targets --all-features -q",
]

[tasks."lint:fix"]
run = "cargo clippy --fix --workspace --all-targets --all-features -q"

[tasks.test]
depends = ["test:abos-javac", "test:lints", "test:scripts"]

[tasks."test:abos-javac"]
run = "cargo test --package abos-javac --all-features -q"

[tasks."test:lints"]
dir = "lints/explicit_binding_types"
run = "cargo test -q"

[tasks."test:scripts"]
run = "python -B -m unittest discover --start-directory scripts/tests --quiet"
