[tools]
android-cli = "1.1.16717390"
"cargo:cargo-dylint" = "6.3.2"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-ndk" = "4.1.2"
"cargo:dylint-link" = "6.3.2"
"cargo:jscpd" = "5.4.2"
dprint = "0.64.3"
fd = "10.5.1"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"
mold = { version = "3.0.0", os = ["linux"] }
python = "3.15.2"
ruff = "0.17.4"

[settings]
task.output = "interleave"
task.quiet = true

[tasks."bench:abos-jni"]
run = "cargo bench --locked --package abos-jni --features invocation --bench api_calls --bench rust_utilities"

[tasks."bench:abos-jni:rust"]
run = "cargo bench --locked --package abos-jni --bench rust_utilities"

[tasks."bench:abos-jvmti"]
run = "cargo bench --locked --package abos-jvmti --features invocation --bench api_calls --bench rust_utilities"

[tasks."bench:abos-jvmti:rust"]
run = "cargo bench --locked --package abos-jvmti --bench rust_utilities"

[tasks.check]
depends = ["fmt:check", "lint", "check:duplicates", "test"]

[tasks."check:android-env"]
run = "python tests/android-test-activity/tests/android_env.py check"

[tasks."check:duplicates"]
run = "jscpd --fail-on-empty --no-tips"

[tasks."clone:all"]
depends = ["clone:javac", "clone:jbindgen", "clone:jni-rs", "clone:jni-sys"]

[tasks."clone:javac"]
run = "python scripts/clone-reference.py javac"

[tasks."clone:jbindgen"]
run = "python scripts/clone-reference.py jbindgen"

[tasks."clone:jni-rs"]
run = "python scripts/clone-reference.py jni-rs"

[tasks."clone:jni-sys"]
run = "python scripts/clone-reference.py jni-sys"

[tasks.fmt]
depends = ["fmt:java", "fmt:python"]
run = [
  "mise fmt -q",
  "cargo fmt --all -q",
  "cargo fmt --manifest-path fuzz/Cargo.toml -q",
  "cargo fmt --manifest-path tools/abos-jni-gen-windows-bindings/Cargo.toml -q",
  "cargo fmt --manifest-path crates/abos-jbindgen/tests/runtime/Cargo.toml -q",
  "cargo fmt --manifest-path tests/android-test-activity/Cargo.toml -q",
  "cargo fmt --manifest-path tests/abos-jni-sys-systest/Cargo.toml -q",
  "cargo fmt --manifest-path tests/abos-jvmti-sys-systest/Cargo.toml -q",
  "cd lints && cargo fmt --all -q",
  "dprint fmt --log-level warn",
]

[tasks."fmt:check"]
depends = ["fmt:java:check", "fmt:python:check"]
run = [
  "mise fmt --check -q",
  "cargo fmt --all --check -q",
  "cargo fmt --manifest-path fuzz/Cargo.toml --check -q",
  "cargo fmt --manifest-path tools/abos-jni-gen-windows-bindings/Cargo.toml --check -q",
  "cargo fmt --manifest-path crates/abos-jbindgen/tests/runtime/Cargo.toml --check -q",
  "cargo fmt --manifest-path tests/android-test-activity/Cargo.toml --check -q",
  "cargo fmt --manifest-path tests/abos-jni-sys-systest/Cargo.toml --check -q",
  "cargo fmt --manifest-path tests/abos-jvmti-sys-systest/Cargo.toml --check -q",
  "cd lints && cargo fmt --all --check -q",
  "dprint check --log-level warn",
]

[tasks."fmt:java"]
run = "mvn --batch-mode --no-transfer-progress -q spotless:apply"

[tasks."fmt:java:check"]
run = "mvn --batch-mode --no-transfer-progress -q spotless:check"

[tasks."fmt:python"]
run = ["ruff check --select I --fix .", "ruff format ."]

[tasks."fmt:python:check"]
run = ["ruff check --select I .", "ruff format --check ."]

[tasks."fuzz:build"]
dir = "fuzz"
run = "cargo fuzz build"

[tasks."fuzz:cafebabe"]
depends = ["fuzz:seed"]
dir = "fuzz"
raw = true
run = "cargo fuzz run cafebabe_parse_class -- -max_len=65536 -timeout=5 -rss_limit_mb=2048"

[tasks."fuzz:seed"]
run = "python scripts/seed-fuzz-corpus.py"

[tasks."fuzz:smoke"]
depends = ["fuzz:smoke:cafebabe"]

[tasks."fuzz:smoke:all"]
depends = [
  "fuzz:smoke:cafebabe",
  "fuzz:smoke:jbindgen-descriptors",
  "fuzz:smoke:jbindgen-parse-class",
  "fuzz:smoke:jni-mutf8",
  "fuzz:smoke:jni-signatures",
  "fuzz:smoke:jni-string-roundtrip",
]

[tasks."fuzz:smoke:cafebabe"]
depends = ["fuzz:seed"]
dir = "fuzz"
run = "cargo fuzz run cafebabe_parse_class -- -max_total_time=60 -max_len=65536 -timeout=5 -rss_limit_mb=2048"

[tasks."fuzz:smoke:jbindgen-descriptors"]
depends = ["fuzz:seed"]
dir = "fuzz"
run = "cargo fuzz run jbindgen_descriptors -- -max_total_time=60 -max_len=65536 -timeout=5 -rss_limit_mb=2048"

[tasks."fuzz:smoke:jbindgen-parse-class"]
depends = ["fuzz:seed"]
dir = "fuzz"
run = "cargo fuzz run jbindgen_parse_class -- -max_total_time=60 -max_len=65536 -timeout=5 -rss_limit_mb=2048"

[tasks."fuzz:smoke:jni-mutf8"]
depends = ["fuzz:seed"]
dir = "fuzz"
run = "cargo fuzz run jni_mutf8 -- -max_total_time=60 -max_len=65536 -timeout=5 -rss_limit_mb=2048"

[tasks."fuzz:smoke:jni-signatures"]
depends = ["fuzz:seed"]
dir = "fuzz"
run = "cargo fuzz run jni_signatures -- -max_total_time=60 -max_len=65536 -timeout=5 -rss_limit_mb=2048"

[tasks."fuzz:smoke:jni-string-roundtrip"]
depends = ["fuzz:seed"]
dir = "fuzz"
run = "cargo fuzz run jni_string_roundtrip -- -max_total_time=60 -max_len=65536 -timeout=5 -rss_limit_mb=2048"

[tasks."generate:abos-jni:windows-bindings"]
run = "cargo run --locked --manifest-path tools/abos-jni-gen-windows-bindings/Cargo.toml -q"

[tasks."generate:abos-jvmti-sys"]
run = "python scripts/generate-jvmti.py"

[tasks."generate:compile-commands"]
run = "python scripts/generate-compile-commands.py"

[tasks.lint]
depends = [
  "lint:abos-jbindgen:runtime",
  "lint:abos-jni-sys:systest",
  "lint:abos-jvmti-sys:systest",
  "lint:docs",
  "lint:python",
  "lint:tools:windows-bindings",
]
env = { DYLINT_RUSTFLAGS = "-D warnings" }
run = [
  "cargo clippy --locked --workspace --all-targets --all-features -q -- -D warnings",
  "cargo dylint --all --workspace --fail-on-no-libraries -q -- --all-targets --all-features --locked -q",
]

[tasks."lint:abos-jbindgen:runtime"]
run = "cargo clippy --manifest-path crates/abos-jbindgen/tests/runtime/Cargo.toml --all-targets --all-features --locked -q -- -D warnings"

[tasks."lint:abos-jni-sys:systest"]
run = "cargo clippy --locked --manifest-path tests/abos-jni-sys-systest/Cargo.toml --all-targets -q -- -D warnings"

[tasks."lint:abos-jvmti-sys:systest"]
run = "cargo clippy --locked --manifest-path tests/abos-jvmti-sys-systest/Cargo.toml --all-targets -q -- -D warnings"

[tasks."lint:docs"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --locked --workspace --all-features --no-deps -q"

[tasks."lint:fix"]
depends = ["lint:python:fix"]
run = "cargo clippy --locked --fix --workspace --all-targets --all-features -q"

[tasks."lint:python"]
run = "ruff check ."

[tasks."lint:python:fix"]
run = "ruff check --fix ."

[tasks."lint:tools:windows-bindings"]
run = "cargo clippy --manifest-path tools/abos-jni-gen-windows-bindings/Cargo.toml --all-targets --all-features --locked -q -- -D warnings"

[tasks."profile:abos-jni"]
description = "Profile a JNI benchmark with flamegraph (Linux, Windows, macOS)"
tools = { "cargo:flamegraph" = "0.6.15" }
usage = '''
arg "[filter]" help="Criterion benchmark filter" default="^jni_call_static_abs_method_safe$"
flag "--seconds <seconds>" help="Profiling duration per matching benchmark" default="15"
'''
run = "python scripts/profile-abos-jni.py"

[tasks."profile:abos-jvmti"]
description = "Profile a JVMTI benchmark with flamegraph (Linux, Windows, macOS)"
tools = { "cargo:flamegraph" = "0.6.15" }
usage = '''
arg "[filter]" help="Criterion benchmark filter" default="^jvmti/phase/wrapper$"
flag "--seconds <seconds>" help="Profiling duration per matching benchmark" default="15"
'''
run = "python scripts/profile-abos-jni.py --package abos-jvmti"

[tasks."setup:android"]
raw = true
run = "python tests/android-test-activity/tests/android_env.py setup"

[tasks."setup:fuzz"]
dir = "fuzz"
run = ["mise install cargo:cargo-fuzz", "rustup show active-toolchain"]

[tasks.test]
depends = [
  "test:abos-jni:examples",
  "test:abos-jni-sys:systest",
  "test:abos-jvmti-sys:systest",
  "test:android-runner",
  "test:lints",
  "test:scripts",
  "test:workspace",
]

[tasks."test:abos-cafebabe"]
run = "cargo test --locked --package abos-cafebabe -q"

[tasks."test:abos-javac"]
run = "cargo test --locked --package abos-javac --all-features -q"

[tasks."test:abos-jbindgen"]
run = "cargo test --locked --package abos-jbindgen --all-features -q"

[tasks."test:abos-jbindgen-annotations"]
run = "cargo test --locked --package abos-jbindgen-annotations -q"

# Requires ANDROID_HOME or ANDROID_SDK_ROOT with platforms;android-35 installed.
[tasks."test:abos-jbindgen:android-sdk"]
run = "cargo test --locked --package abos-jbindgen --test android_sdk_installed -q -- --ignored"

[tasks."test:abos-jbindgen:parity"]
run = [
  "cargo test --package abos-jbindgen --lib internal::java_parser::tests --locked -q",
  "cargo test --package abos-jbindgen --test runtime --locked -q",
]

[tasks."test:abos-jni"]
run = "cargo test --locked --package abos-jni -q"

[tasks."test:abos-jni-macros"]
run = "cargo test --locked --package abos-jni-macros -q"

[tasks."test:abos-jni-sys"]
run = "cargo test --locked --package abos-jni-sys -q"

[tasks."test:abos-jni-sys-macros"]
run = "cargo test --locked --package abos-jni-sys-macros -q"

[tasks."test:abos-jni-sys:jvm"]
run = "cargo test --locked --package abos-jni-sys --test invocation -q -- --ignored"

[tasks."test:abos-jni-sys:systest"]
run = "cargo test --locked --manifest-path tests/abos-jni-sys-systest/Cargo.toml -q"

[tasks."test:abos-jni:examples"]
run = [
  "cargo run --locked --package abos-jni --features invocation --example bind_java_type -q",
  "cargo run --locked --package abos-jni --features invocation --example bind_java_type_hooks -q",
  "cargo run --locked --package abos-jni --features invocation --example bind_java_type_is_instance_of -q",
  "cargo run --locked --package abos-jni --features invocation --example bind_java_type_wrapper -q",
  "cargo run --locked --package abos-jni --features invocation --example jni_sig -q",
  "cargo run --locked --package abos-jni --features invocation --example jni_sig_wrapper -q",
  "cargo run --locked --package abos-jni --features invocation --example jni_str -q",
  "cargo run --locked --package abos-jni --features invocation --example native_method -q",
  "cargo run --locked --package abos-jni --features invocation --example native_method_wrapper -q",
]

[tasks."test:abos-jni:jvm"]
run = "cargo test --locked --package abos-jni --all-features -q"

[tasks."test:abos-jvmti"]
run = "cargo test --locked --package abos-jvmti -q"

[tasks."test:abos-jvmti-sys"]
run = "cargo test --locked --package abos-jvmti-sys -q"

[tasks."test:abos-jvmti-sys:systest"]
run = [
  "python scripts/generate-jvmti.py --check",
  "cargo test --locked --manifest-path tests/abos-jvmti-sys-systest/Cargo.toml -q",
]

[tasks."test:android"]
run = "python tests/android-test-activity/tests/run.py"

[tasks."test:android-runner"]
run = "python -B -m unittest discover --start-directory tests/android-test-activity/tests --pattern 'test_*.py' --quiet"

[tasks."test:android:check"]
run = "python tests/android-test-activity/tests/run.py --compile-only --suite full"

[tasks."test:android:package"]
run = "python tests/android-test-activity/tests/run.py --package-only --suite full"

[tasks."test:android:smoke"]
run = "python tests/android-test-activity/tests/run.py --suite smoke"

[tasks."test:fuzz-seeds"]
dir = "fuzz"
run = "cargo test --locked --test seeds -q"

[tasks."test:lints"]
dir = "lints"
run = "cargo test --locked --workspace -q"

[tasks."test:scripts"]
run = "python -B -m unittest discover --start-directory scripts/tests --quiet"

[tasks."test:workspace"]
run = [
  "cargo test --locked --workspace --all-features -q",
  "cargo test --locked --package abos-jni -q",
  "cargo test --locked --package abos-jni-sys --test invocation -q -- --ignored",
]
