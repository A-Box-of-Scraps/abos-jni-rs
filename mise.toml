[tools]
dprint = "0.64.3"
"cargo:jscpd" = "5.4.2"

[settings]
task.output = "interleave"
task.quiet = true

[tasks.check]
depends = ["fmt", "lint", "check:duplicates"]

[tasks."check:duplicates"]
run = "jscpd --fail-on-empty --no-tips"

[tasks.fmt]
run = ["mise fmt -q", "cargo fmt --all -q", "dprint fmt --log-level warn"]

[tasks."fmt:check"]
run = [
  "mise fmt --check -q",
  "cargo fmt --all --check -q",
  "dprint check --log-level warn",
]

[tasks.lint]
run = "cargo clippy --workspace --all-targets --all-features -q -- -D warnings"

[tasks."lint:fix"]
run = "cargo clippy --fix --workspace --all-targets --all-features -q"
